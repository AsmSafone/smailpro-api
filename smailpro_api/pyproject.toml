[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smailpro-api"
version = "1.0.0"
description = "Python wrapper for SmailPro temporary email service with multi-provider support and automated CAPTCHA bypass"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["email", "temporary-email", "captcha-solver", "turnstile", "smailpro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "requests>=2.28.0",
]

authors = [
    {name = "AsmSafone", email = "asmsafone@gmail.com"}
]

[project.urls]
Homepage = "https://github.com/AsmSafone/smailpro-api"
Repository = "https://github.com/AsmSafone/smailpro-api"
Issues = "https://github.com/AsmSafone/smailpro-api/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smailpro_api = ["py.typed"]
